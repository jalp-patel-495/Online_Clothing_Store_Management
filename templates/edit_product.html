{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3 class="mb-4">Edit Product</h3>

    <form method="POST">
        <div class="row">

            <!-- Product Name -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-control"
                       value="{{ product.name }}" required>
            </div>

            <!-- Size -->
            <div class="col-md-3 mb-3">
                <label class="form-label">Size</label>
                <select name="size" class="form-select">
                    <option value="">Select Size</option>
                    {% for s in ['S','M','L','XL','XXL'] %}
                    <option value="{{ s }}" {% if product.size == s %}selected{% endif %}>
                        {{ s }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Color -->
            <div class="col-md-3 mb-3">
                <label class="form-label">Color</label>
                <input type="text" name="color" class="form-control"
                       value="{{ product.color }}">
            </div>

            <!-- Description -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="4">{{ product.description }}</textarea>
            </div>

            <!-- Stock Quantity -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Stock Quantity</label>
                <input type="number" name="stock" class="form-control" value="{{ product.stock }}">
            </div>

            <!-- Price -->
            <div class="col-md-3 mb-3">
                <label class="form-label">Price (Rs)</label>
                <input type="number" step="0.01" name="price" class="form-control"
                       value="{{ product.price }}" required>
            </div>

            <!-- Discount -->
            <div class="col-md-3 mb-3">
                <label class="form-label">Discount (%)</label>
                <input type="number" name="discount" class="form-control"
                       value="{{ product.discount or 0 }}">
            </div>

            <!-- Image URL -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Image URL</label>
                <input type="text" name="image" class="form-control"
                       value="{{ product.image }}">
                <small class="text-muted">
                    Leave empty to use default placeholder image
                </small>
            </div>

            <!-- Category -->
            <!-- <div class="col-md-3 mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select">
                    <option value="">Select Category</option>
                    {% for c in ['Shirt','T-Shirt','Jeans','Jacket','Hoodie','Kurti','Dress'] %}
                    <option value="{{ c }}" {% if product.category == c %}selected{% endif %}>
                        {{ c }}
                    </option>
                    {% endfor %}
                </select>
            </div> -->
            <select name="category_id" class="form-select">
                <option value="">Select Category</option>
                {% for c in categories %}
                <option value="{{ c.id }}"
                    {% if product.category_id == c.id %}selected{% endif %}>
                    {{ c.name }}
                </option>
                {% endfor %}
            </select>


            <!-- Gender -->
            <div class="col-md-3 mb-3">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option value="">Select Gender</option>
                    <option value="men" {% if product.gender=='men' %}selected{% endif %}>Men</option>
                    <option value="women" {% if product.gender=='women' %}selected{% endif %}>Women</option>
                    <option value="kids" {% if product.gender=='kids' %}selected{% endif %}>Kids</option>
                </select>
            </div>

        </div>

        <!-- Buttons -->
        <div class="mt-4">
            <a href="{{ url_for('admin_products') }}" class="btn btn-secondary">
                ← Back to Products
            </a>
            <button type="submit" class="btn btn-primary">
                💾 Update Product
            </button>
        </div>
    </form>
</div>
{% endblock %}
